<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Полиглот">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Полиглот — изучение языков</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Полиглот</h1>
    <select id="lang" aria-label="Язык"></select>
    <div class="stats"><button id="share" title="Поделиться" aria-label="Поделиться">📤</button><span id="streak">🔥 0</span><span id="xp">⭐ 0</span></div>
  </header>
  <nav id="nav">
    <button data-view="home">Главная</button>
    <button data-view="cards">Карточки</button>
    <button data-view="quiz">Тест</button>
    <button data-view="typing">Письмо</button>
    <button data-view="words">Слова</button>
  </nav>
  <main id="view"></main>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
